name: Sincronizar Jira e laboratórios

on:
  schedule:
    - cron: "17 10 * * 1-5"   # dias úteis, 7h17 em Natal (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Exportar cards do Jira
        if: ${{ env.JIRA_API_TOKEN != '' }}
        run: python3 scripts/sync_jira.py

      - name: Copiar base de laboratórios do repositório labs
        run: |
          curl -fsSL https://raw.githubusercontent.com/raphaeljrodrigues1986/labs/main/embedded_data.js -o /tmp/labs.js \
            && grep -q "__FUNPEC_LABS_DATA__" /tmp/labs.js && cp /tmp/labs.js data/labs.js || echo "Base de laboratórios não atualizada."

      - name: Publicar alterações
        run: |
          git config user.name "painel-din-bot"
          git config user.email "painel-din-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados do painel ($(date -u +%Y-%m-%d))"
          git push
